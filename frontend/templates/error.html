{% extends "base.html" %}

{% block title %}{{ title }} - NeuroTriage{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>{{ title }}</h1>
    <p class="subtitle">Error {{ code }}</p>
    <p>{{ message }}</p>
    <p>
        {% if session.get('user_id') %}
            <a href="{{ url_for('dashboard.dashboard') }}" class="link">&larr; Back to dashboard</a>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="link">&larr; Go to login</a>
        {% endif %}
    </p>
</section>
{% endblock %}
