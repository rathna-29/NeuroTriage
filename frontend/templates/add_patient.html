
{% extends "base.html" %}

{% block title %}Add Patient - NeuroTriage{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>Add Patient</h1>
    <p class="subtitle">Use synthetic/demo data only.</p>

    <form method="post" action="{{ url_for('patients.add_patient') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="patient_code">Patient ID</label>
        <input type="text" id="patient_code" name="patient_code"
               value="{{ form.get('patient_code', '') }}" placeholder="e.g. P001" required>

        <label for="age">Age (years)</label>
        <input type="number" id="age" name="age" min="0" max="120"
               value="{{ form.get('age', '') }}" required>

        <label for="sex">Sex</label>
        <select id="sex" name="sex" required>
            <option value="">-- Select --</option>
            {% for option in ['Male', 'Female', 'Other', 'Not recorded'] %}
                <option value="{{ option }}" {% if form.get('sex') == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-primary">Save patient</button>
    </form>

    <p><a href="{{ url_for('patients.patient_list') }}" class="link">&larr; Back to patient records</a></p>
</section>
{% endblock %}
